<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Surface to Navy -->
    <linearGradient id="ih-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101A30" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <!-- Cyan Dot Ambient Glow Filter -->
    <filter id="dot-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-xl Monogram Card -->
  <rect
    x="3"
    y="3"
    width="58"
    height="58"
    rx="16"
    fill="url(#ih-bg)"
    stroke="#253966"
    stroke-width="2.5"
  />

  <!-- Top-Right Accent Dot -->
  <circle cx="51" cy="13" r="5" fill="#38BDF8" opacity="0.4" />
  <circle cx="51" cy="13" r="3.5" fill="#38BDF8" filter="url(#dot-glow)" />

  <!-- Monogram IH: Cyan "I" + Electric Blue "H" -->
  <text
    x="32"
    y="43"
    font-family="'JetBrains Mono', 'SF Mono', 'Roboto Mono', Menlo, Monaco, Consolas, monospace"
    font-size="28"
    font-weight="900"
    text-anchor="middle"
    letter-spacing="-1.5"
  >
    <tspan fill="#38BDF8">I</tspan><tspan fill="#2563EB">H</tspan>
  </text>
</svg>
